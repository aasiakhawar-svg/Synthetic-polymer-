<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Synthetic Polymers Board</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f7f9f4;--card:#fff;--tx:#1f2430;--mu:#5d6575;--bd:#dfe3d8;--ac:#6aa820;--ac2:#e8820c;--ok:#1d8a4e;--bad:#d12a2a;--bl:#2f6fd0;--rd:#d63a3a;--yl:#ffe27a}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171a;--card:#1e2327;--tx:#eef1f0;--mu:#9aa6a3;--bd:#323b40;--ac:#8fd13a;--ac2:#ffa033;--ok:#4cd08a;--bad:#ff6b6b;--bl:#6aa6ff;--rd:#ff7a7a;--yl:#6b5a10}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;line-height:1.5}
main{max-width:940px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;margin:.2em 0}.sub{color:var(--mu);margin:0 0 12px}
button,select,input{font:inherit;color:var(--tx)}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
nav button{padding:8px 14px;border:1px solid var(--bd);background:var(--card);border-radius:999px;cursor:pointer}
nav button.on{background:var(--ac);border-color:var(--ac);color:#111;font-weight:700}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.btn{padding:8px 14px;border:1px solid var(--bd);background:var(--card);border-radius:8px;cursor:pointer}
.btn.p{background:var(--ac2);color:#111;border-color:var(--ac2);font-weight:600}
.btn.on{background:var(--ac);border-color:var(--ac);color:#111;font-weight:600}
.svgw{overflow-x:auto;background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:6px}
svg text{fill:var(--tx);font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;text-anchor:middle;dominant-baseline:middle}
svg line{stroke:var(--tx);stroke-width:2}
.eq{font-family:ui-monospace,Menlo,Consolas,monospace;padding:10px 12px;background:var(--bg);border:1px solid var(--bd);border-radius:8px;overflow-x:auto;white-space:nowrap;margin:8px 0}
.res{padding:10px 12px;border-radius:8px;border-left:5px solid var(--ok);background:var(--bg);margin-top:8px}
.res.no{border-color:var(--bad)}
.key{padding:10px 12px;border-radius:8px;border-left:5px solid var(--ac2);background:var(--bg);margin:8px 0;font-size:.95rem}
.note{font-size:.9rem;color:var(--mu)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:620px){.two{grid-template-columns:1fr}}
.blk{display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:700;border-radius:6px;padding:10px 8px;min-width:46px;font-size:.85rem}
.A{background:var(--bl)}.D{background:var(--rd)}
.es{background:var(--yl);padding:6px 4px;border-radius:50%;font-size:.7rem;font-weight:700}
.chain{display:flex;align-items:center;gap:3px;flex-wrap:wrap;margin:10px 0;font-size:.85rem;font-family:ui-monospace,monospace}
.w{color:var(--bl);font-weight:700}
.opt{display:block;width:100%;text-align:left;margin:6px 0;padding:9px 12px;border:1px solid var(--bd);background:var(--card);border-radius:8px;cursor:pointer}
.opt.good{border-color:var(--ok);background:rgba(29,138,78,.15)}.opt.bad{border-color:var(--bad);background:rgba(209,42,42,.12)}
.chem{display:inline-block;background:#c8202f;color:#fff;font-size:.7rem;font-weight:700;padding:1px 8px;border-radius:4px;margin-left:6px}
input[type=range]{width:200px}
</style></head><body><main>
<h1>🧬 Synthetic Polymers Board</h1>
<p class="sub">Monomers → polymers · addition · disposal · condensation (polyesters)</p>
<nav id="nav"></nav><div id="view"></div>
</main>
<script>
const $=s=>document.querySelector(s);
const tabs=['Addition','Find the monomer','Disposal','Polyesters','Quiz'];let tab=0;
function nav(){$('#nav').innerHTML=tabs.map((t,i)=>`<button class="${i==tab?'on':''}" onclick="tab=${i};nav();draw()">${i+1}. ${t}${i==3?'<span class="chem">CHEM</span>':''}</button>`).join('')}

/* monomer data: [topLeft,botLeft,topRight,botRight] */
const MON={
 ethene:{n:'ethene',p:'poly(ethene)',f:'CH₂=CH₂',s:['H','H','H','H'],use:'LDPE: thin, flexible carrier bags. HDPE: stronger, rigid – milk bottles (look for HDPE).'},
 propene:{n:'propene',p:'poly(propene)',f:'CH₃CH=CH₂',s:['CH₃','H','H','H'],use:'Stronger than poly(ethene): ropes and crates (recycling mark PP).'},
 chloroethene:{n:'chloroethene',p:'poly(chloroethene) = PVC',f:'CH₂=CHCl',s:['Cl','H','H','H'],use:'Strong and rigid: water pipes, windows. With plasticisers: flexible floor covering, clothing. Insulates electrical wires.'},
 tetrafluoroethene:{n:'tetrafluoroethene',p:'poly(tetrafluoroethene) = PTFE',f:'CF₂=CF₂',s:['F','F','F','F'],use:'Very unreactive (strong C–F bonds): non-stick pans, linings for corrosive chemicals.'},
 styrene:{n:'styrene',p:'poly(styrene)',f:'CH₂=CH(C₆H₅)',s:['C₆H₅','H','H','H'],use:'Textbook example for deducing a monomer from a repeat unit.'}};
const colr=t=>t=='Cl'?'#1e9b4a':t=='F'?'#c9a800':(t.length>1?'#d63a3a':'');
function T(x,y,t){return `<text x="${x}" y="${y}" ${colr(t)?`style="fill:${colr(t)};font-weight:700"`:''}>${t}</text>`}
/* draw chain: m, n monomers, joined?, repeat-unit highlight index (or -1), brackets */
function draw_chain(m,n,joined,hl){
 const s=m.s,W=60+n*110,cy=70;let o=`<svg viewBox="0 0 ${W} 140" width="${W}" height="140">`;
 for(let i=0;i<n;i++){
  const x1=50+i*110,x2=x1+52;
  o+=`<line x1="${x1+10}" y1="${cy}" x2="${x2-10}" y2="${cy}"/>`;
  if(!joined)o+=`<line x1="${x1+10}" y1="${cy+5}" x2="${x2-10}" y2="${cy+5}"/>`;
  o+=`<text x="${x1}" y="${cy}">C</text><text x="${x2}" y="${cy}">C</text>`;
  [[x1,s[0],-1],[x1,s[1],1],[x2,s[2],-1],[x2,s[3],1]].forEach(([x,t,d])=>{o+=`<line x1="${x}" y1="${cy+d*11}" x2="${x}" y2="${cy+d*30}"/>`+T(x,cy+d*42,t)});
  if(joined&&i<n-1)o+=`<line x1="${x2+10}" y1="${cy}" x2="${x2+48}" y2="${cy}"/>`;
 }
 if(joined){o+=`<line x1="4" y1="${cy}" x2="38" y2="${cy}"/><line x1="${W-48}" y1="${cy}" x2="${W-4}" y2="${cy}"/>`}
 if(hl>=0){const x=50+hl*110;o+=`<rect x="${x-24}" y="14" width="100" height="112" rx="6" fill="none" stroke="#d63a3a" stroke-width="2" stroke-dasharray="5 4"/>`}
 return o+'</svg>'}

/* ---- Tab 1 ---- */
let mk='ethene',joined=false,nn=4;
function t1(){const m=MON[mk];
 return `<div class="card"><b>Addition polymerisation:</b> many small <b>monomers</b> (alkenes, with a C=C) join into one long <b>polymer</b>. Part of each double bond opens up to become a single bond and the freed electrons link neighbouring molecules. <b>Nothing else is formed.</b></div>
 <div class="card"><div class="row">${Object.keys(MON).map(k=>`<button class="btn ${k==mk?'on':''}" onclick="mk='${k}';joined=false;draw()">${k}</button>`).join('')}</div>
 <div class="row"><label>Monomers: <input type="range" min="2" max="5" value="${nn}" oninput="nn=+this.value;draw()"> ${nn}</label>
 <button class="btn p" onclick="joined=!joined;draw()">${joined?'◀ Break apart':'Polymerise ▶'}</button><span class="note">heat, high pressure + initiator</span></div>
 <div class="svgw">${draw_chain(m,nn,joined,-1)}</div>
 <div class="eq">n ${m.f} → [ –CH₂–CH${m.s[0]=='H'?'₂':'('+m.s[0]+')'}– ]ₙ</div>
 <div class="res"><b>Monomer:</b> ${m.n} (${m.f})<br><b>Polymer:</b> ${m.p}<br><b>Uses:</b> ${m.use}</div>
 <div class="key"><b>Hint:</b> draw the alkene with just C=C in the middle. Never change anything except opening the double bond and adding continuation bonds. Square brackets and <i>n</i> show the repeat unit repeating.${mk=='ethene'?'<br><b>Key point:</b> poly(ethene) is saturated – it will <u>not</u> decolourise bromine water. The initiator is used up, so it is not a catalyst.':''}</div></div>
 <div class="card"><b>Monomer vs repeat unit vs polymer</b><br>Monomer = the small alkene (has C=C). Repeat unit = the bracketed part (all single bonds). Polymer = the whole long chain.</div>`}

/* ---- Tab 2 ---- */
let pk='propene',st=0;
function t2(){const m=MON[pk];
 const lbl=['Here is a section of the polymer chain.','Step 1: pick any two adjacent carbons in the main chain – that is the repeat unit.','Step 2: replace the C–C with C=C and remove the continuation bonds.'];
 let body=`<div class="svgw">${draw_chain(m,4,true,st>=1?1:-1)}</div>`;
 if(st>=2)body+=`<div class="svgw" style="margin-top:8px">${draw_chain(m,1,false,-1)}</div><div class="res"><b>Monomer = ${m.n}</b> (${m.f})</div>`;
 return `<div class="card"><b>Working out the monomer from a polymer</b> (exam favourite). Work from the structure you are given – ignore complicated groups like C₆H₅.</div>
 <div class="card"><div class="row">${['propene','chloroethene','tetrafluoroethene','styrene','ethene'].map(k=>`<button class="btn ${k==pk?'on':''}" onclick="pk='${k}';st=0;draw()">${MON[k].p.split(' ')[0]}</button>`).join('')}</div>
 <p><b>${lbl[st]}</b></p>${body}
 <div class="row"><button class="btn" onclick="st=Math.max(0,st-1);draw()">◀ Back</button><button class="btn p" onclick="st=Math.min(2,st+1);draw()">Next ▶</button></div>
 <p class="note">Challenge: cover the answer, name the monomer yourself first, then press Next.</p></div>`}

/* ---- Tab 3 ---- */
const SORT=[['Cheap','L'],['Uses large areas of land','L'],['Produces CO₂ (global warming)','I'],['Can generate electricity / heat','I'],['Waste remains for thousands of years','L'],['Releases toxic gases e.g. CO, HCl','I'],['Requires little space','I'],['Ash must still be landfilled','I'],['No toxic or greenhouse gases made','L'],['Expensive to build and maintain plant','I']];
let si=0,sc3=0,sa=null;
function t3(){
 const q=SORT[si];
 const game=si>=SORT.length?`<h3>Score: ${sc3}/${SORT.length}</h3><button class="btn p" onclick="si=0;sc3=0;sa=null;draw()">Again</button>`:
 `<p class="note">${si+1}/${SORT.length} · Which method does this belong to?</p><p style="font-size:1.1rem"><b>“${q[0]}”</b></p>
 <div class="row"><button class="btn" onclick="ans3('L')">Landfill</button><button class="btn" onclick="ans3('I')">Incineration</button></div>
 ${sa?`<div class="res ${sa=='ok'?'':'no'}">${sa=='ok'?'Correct!':'Not quite – it is '+(q[1]=='L'?'landfill':'incineration')+'.'} <button class="btn p" onclick="si++;sa=null;draw()">Next ▶</button></div>`:''}`;
 return `<div class="card"><b>Why are addition polymers a problem?</b><br>They contain strong covalent bonds, so they are <b>inert</b> at ordinary temperatures and <b>non-biodegradable</b> – bacteria cannot break them down, so they last for thousands of years. Recycling saves raw materials and reduces waste.</div>
 <div class="two"><div class="card"><b>🗑️ Landfill</b><br>Burying waste in big holes.<br>✔ Cheap · no greenhouse or toxic gases from the plastic<br>✘ Ugly, smelly, noisy · uses lots of land · waste stays for thousands of years</div>
 <div class="card"><b>🔥 Incineration</b><br>Burning to release heat energy.<br>✔ Little space · heat/electricity generated<br>✘ Expensive plant · CO₂ (global warming) · toxic CO and HCl (from PVC) · ash still goes to landfill</div></div>
 <div class="card"><b>Sorting game</b>${game}</div>`}
function ans3(a){if(sa)return;if(SORT[si][1]==a){sc3++;sa='ok'}else sa='no';draw()}

/* ---- Tab 4 ---- */
let acid='ethanedioic',nu=2,cj=false;
function t4(){
 const ac=acid=='ethanedioic'?{n:'ethanedioic acid',f:'HOOC–COOH',b:'C–C'}:{n:'hexane-1,6-dioic acid',f:'HOOC(CH₂)₄COOH',b:'(CH₂)₄'};
 let ch='';
 if(!cj){for(let i=0;i<nu;i++)ch+=`<span class="w">HO–</span><span class="blk A">${ac.b}</span><span class="w">–OH</span> &nbsp; <span class="w">H–</span><span class="blk D">O–CH₂CH₂–O</span><span class="w">–H</span> &nbsp;`}
 else{ch+=`<span class="w">HO–</span>`;for(let i=0;i<nu;i++){ch+=`<span class="blk A">${ac.b}</span><span class="es">COO</span><span class="blk D">CH₂CH₂</span>`+(i<nu-1?'<span class="es">COO</span>':'<span class="es">O</span>')}ch+=`<span class="w">–H</span>`}
 const water=cj?2*nu-1:0;
 return `<div class="card"><b>Condensation polymerisation</b> <span class="chem">CHEMISTRY ONLY</span><br>Two different monomers – a <span class="w">dicarboxylic acid</span> (–COOH at both ends, 🟦) and a <b style="color:var(--rd)">diol</b> (–OH at both ends, 🟥) – join alternately. Each time a bond forms, a small molecule (<b>H₂O</b>) is lost. The link is an <b>ester group</b> (🟡), so the polymer is a <b>polyester</b>.</div>
 <div class="card"><div class="row"><button class="btn ${acid=='ethanedioic'?'on':''}" onclick="acid='ethanedioic';draw()">ethanedioic acid</button><button class="btn ${acid!='ethanedioic'?'on':''}" onclick="acid='hexane';draw()">hexane-1,6-dioic acid</button>
 <label>Units: <input type="range" min="1" max="4" value="${nu}" oninput="nu=+this.value;draw()"> ${nu}</label>
 <button class="btn p" onclick="cj=!cj;draw()">${cj?'◀ Separate':'Remove water & join ▶'}</button></div>
 <div class="chain">${ch}</div>
 ${cj?`<div class="res">💧 ${water} H₂O molecules released (idealised equation says 2n; really 2n−1 since an –OH and –COOH remain at the ends).</div>`:''}
 <div class="eq">nHOOC–COOH + nHO–CH₂CH₂–OH → [ –OC–CO–O–CH₂CH₂–O– ]ₙ + 2nH₂O</div>
 <div class="key"><b>Hint:</b> it does not matter which monomer gives the OH and which the H – the polymer is the same. Practise: draw the diol as a red rectangle with OH ends, the diacid as a blue rectangle with COOH ends, remove water, join up.</div>
 <div class="note">Diol names: ethane-1,2-diol (CH₂OHCH₂OH), propane-1,3-diol – the extra ‘e’ is correct, and ‘di’ = two –OH groups.</div></div>
 <div class="card"><b>♻️ Biopolyesters</b><br>Ester links are more reactive than C–C chains, so polyesters eventually break down; biopolyesters break down much faster. <b>Lactic acid</b> (CH₃CH(OH)COOH) has an –OH <i>and</i> a –COOH, so it can <b>self-polymerise</b> into <b>PLA</b> – made from corn starch, used for compostable bags and surgical stitches.<br><span class="note">Extension: amino acids (–NH₂ + –COOH) condense into polypeptides (proteins) via an amide bond.</span></div>
 <div class="card"><b>Addition vs condensation</b><br>Addition: one monomer type (has C=C), nothing lost, saturated polymer. Condensation: two monomers (or one with two groups), small molecule (H₂O) lost, ester links.</div>`}

/* ---- Tab 5 ---- */
const Q=[['What happens to the carbon–carbon double bond in addition polymerisation?',['It stays as a double bond','It opens into a single bond','It becomes a triple bond','It is removed with water'],1,'Part of the double bond breaks; the electrons join neighbouring molecules.'],
['The monomer of PVC is…',['Ethene','Propene','Chloroethene','Tetrafluoroethene'],2,'PVC = poly(chloroethene), CH₂=CHCl.'],
['A repeat unit is –CH₂–CH(CH₃)–. The polymer is…',['Poly(ethene)','Poly(propene)','PVC','PTFE'],1,'Putting C=C back gives propene.'],
['Why are addition polymers hard to dispose of?',['They are soluble','They contain strong bonds and are non-biodegradable','They are very light','They explode'],1,'They are inert, so bacteria cannot break them down.'],
['Why can PTFE line pans and corrosive-chemical containers?',['Strong C–F bonds make it very unreactive','It conducts heat well','It is biodegradable','It is cheap'],0,'The strong carbon–fluorine bonds make it unreactive.'],
['Which gas from burning PVC is toxic?',['Nitrogen','Oxygen','Hydrogen chloride','Argon'],2,'Burning plastics also gives CO, plus CO₂ (global warming).'],
['Condensation polymerisation of a diol and a dicarboxylic acid gives…',['A polyester and water','An alkane and CO₂','Poly(ethene)','A salt'],0,'Water is lost each time an ester link forms.'],
['Why is poly(ethene) not decolourising bromine water?',['It is unsaturated','It is saturated (an alkane-like chain)','It is a salt','It is acidic'],1,'No C=C remains in the polymer.']];
let qi=0,sc=0,ans=null;
function t5(){if(qi>=Q.length)return `<div class="card"><h2>Score: ${sc} / ${Q.length}</h2><button class="btn p" onclick="qi=0;sc=0;ans=null;draw()">Try again</button></div>`;
 const q=Q[qi];return `<div class="card"><p class="note">Question ${qi+1} of ${Q.length}</p><p><b>${q[0]}</b></p>${q[1].map((o,i)=>`<button class="opt ${ans!=null?(i==q[2]?'good':i==ans?'bad':''):''}" ${ans!=null?'disabled':''} onclick="ans=${i};if(${i}==${q[2]})sc++;draw()">${o}</button>`).join('')}
 ${ans!=null?`<div class="res ${ans==q[2]?'':'no'}">${ans==q[2]?'Correct! ':'Not quite. '}${q[3]}</div><p><button class="btn p" onclick="qi++;ans=null;draw()">${qi==Q.length-1?'See score':'Next'} ▶</button></p>`:''}</div>`}

function draw(){$('#view').innerHTML=[t1,t2,t3,t4,t5][tab]()}
nav();draw();
</script></body></html>
